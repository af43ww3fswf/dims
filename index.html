<!DOCTYPE html>

            const rootElement = document.getElementById("root");

            const clientBuilder = {
                getClient: () => ({ /* mock client */ })

            // Initialize the component
            const component = window.createExternalRoot(rootElement, clientBuilder);

            // Mock Content Hub entity and config
            const mockProps = {
                entity: {
                    getPropertyValue: (propName) => {
                        console.log(`Getting property: ${propName}`);
                        return null; // Return mock dimensions string if needed
                    },
                    setPropertyValue: (propName, value) => {
                        console.log(`Setting property: ${propName} to ${value}`);
                    }
                },
                config: {
                    // add any mock config if required
                }
            };

            // Render the component
            component.render(mockProps);
        });
    </script>
